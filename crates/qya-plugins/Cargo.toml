[package]
name = "qya-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
qya-agent = { version = "0.1.0", path = "../qya-agent" }
qya-config = { version = "0.1.0", path = "../qya-config" }
qya-core = { version = "0.1.0", path = "../qya-core" }
qya-llm = { version = "0.1.0", path = "../qya-llm" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2", "multipart", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "fs", "process"] }
tokio-util = "0.7.20"
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.20"
wiremock = "0.6.5"
