[package]
name = "qya-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
qya-core = { version = "0.1.0", path = "../qya-core" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
