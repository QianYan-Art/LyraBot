[package]
name = "lyrabot-douyin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
hex = "0.4.3"
jiff = "0.2.39"
lyrabot-agent = { version = "0.1.0", path = "../lyrabot-agent" }
lyrabot-config = { version = "0.1.0", path = "../lyrabot-config" }
lyrabot-core = { version = "0.1.0", path = "../lyrabot-core" }
rand = "0.10.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "fs", "net", "io-util", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tokio-util = "0.7.20"
