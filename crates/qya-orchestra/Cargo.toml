[package]
name = "qya-orchestra"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
qya-agent = { version = "0.1.0", path = "../qya-agent" }
qya-config = { version = "0.1.0", path = "../qya-config" }
qya-core = { version = "0.1.0", path = "../qya-core" }
qya-llm = { version = "0.1.0", path = "../qya-llm" }
qya-store = { version = "0.1.0", path = "../qya-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
