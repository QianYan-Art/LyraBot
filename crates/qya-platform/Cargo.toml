[package]
name = "qya-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
jiff = "0.2.39"
qya-config = { version = "0.1.0", path = "../qya-config" }
qya-core = { version = "0.1.0", path = "../qya-core" }
qya-store = { version = "0.1.0", path = "../qya-store" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "sync", "macros", "rt", "time", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "connect"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
rusqlite = "0.41.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
