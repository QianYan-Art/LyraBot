[package]
name = "qya-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
croner = { version = "4.0.3", default-features = false, features = ["jiff"] }
jiff = "0.2.39"
qya-agent = { version = "0.1.0", path = "../qya-agent" }
qya-config = { version = "0.1.0", path = "../qya-config" }
qya-core = { version = "0.1.0", path = "../qya-core" }
qya-store = { version = "0.1.0", path = "../qya-store" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "time", "process", "fs", "io-util"] }
tokio-util = "0.7.20"
toml = "1.2.1"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "rt"] }
tokio-util = "0.7.20"
