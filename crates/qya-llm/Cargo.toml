[package]
name = "qya-llm"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
futures-util = "0.3.34"
qya-config = { version = "0.1.0", path = "../qya-config" }
qya-core = { version = "0.1.0", path = "../qya-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json", "http2", "gzip"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
