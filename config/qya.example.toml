# qya 配置示例。相对路径以本文件所在目录为基准。
# secret 一律放在独立文件里（*_file），不要直接写进本文件。

[paths]
data_dir = "data"

[llm]
default_provider = "kimi-code"

[llm.providers.kimi-code]
base_url = "https://api.kimi.com/coding/v1"
key_file = "secrets/kimi.key"
transport = "chat_completions"
# user_agent = "qy-assistant/0.1"   # Chat Completions 实测无需特殊 UA（2026-11-07）

# kimi-code 思考恒开，reasoning_effort 只接受 low/high/max（2026-11-07 /models 实测）
[llm.providers.kimi-code.effort_map]
low = "low"
medium = "high"
high = "high"
xhigh = "max"
max = "max"

[llm.providers.kimi-code.models.k3-256k]
context_length = 262144
vision = true

[llm.providers.kimi-code.models."k3.1-pro"]
context_length = 1048576
vision = true
video = true

[llm.providers.kimi-code.models.k3]
context_length = 1048576
vision = true
video = true

[llm.providers.kimi-code.models.kimi-for-coding]
context_length = 1048576
vision = true
video = true

[llm.providers.kimi-code.models.kimi-for-coding-highspeed]
context_length = 262144
vision = true
video = true

[persona]
model = "k3-256k"
effort = "low"
assets_dir = "persona"
# memory_dir = "data/memory"   # 默认 <data_dir>/memory

[persona.keepalive]
interval_minutes = 18          # 距上次模型请求多少分钟发一次 1-token 保活续期（设为 0 关闭）
max_count = 9                  # 用户说话后最多连续保活次数（约 2.7 小时，设为 0 关闭）

# 多代理编排（docs/05-orchestra.md）
[orchestra]
default_model = "kimi-for-coding"
default_effort = "high"
max_concurrent = 3
context_window = 131072        # 后台执行者（worker 与专员）上下文窗口上限（128K，主会话的一半）
worker_prompt = "agents/worker.md"
worker_tools = ["shell", "fs_read", "fs_write", "fs_patch", "fs_search", "todo", "skill_view", "web_search", "grok_search", "grok_fetch", "image_generate"]

[orchestra.specialists.ops]
description = "运维：服务器、邮件、博客同步、流量日报（Komari 探针里各台服务器近 24 小时的上下行流量）"
memory = "ops.md"
tools = ["shell", "fs_read", "fs_write", "fs_patch", "fs_search", "todo", "skill_view", "web_search", "grok_search", "grok_fetch", "komari_report", "blog_sync", "mail"]

[orchestra.specialists.creator]
description = "创作：抖音发布、封面与生图"
memory = "creator.md"
tools = ["shell", "fs_read", "fs_write", "fs_patch", "fs_search", "todo", "skill_view", "web_search", "grok_search", "grok_fetch", "image_generate", "speak", "douyin_login", "douyin_content", "douyin_verification"]

# 内置工具（docs/06-tools-plugins.md 第 1 节）
[tools]
skills_dir = "/opt/qya/skills"
media_dir = "/var/lib/qya/media"
audit_log = "/var/log/qya/audit.jsonl"
komari_config = "secrets/komari.toml"
blog_script = "/usr/local/bin/blog-sync-kbase.sh"
blog_timeout_s = 1300

[tools.shell]
shell = "bash"
workdir = "/var/lib/qya/work"
timeout_s = 120
max_timeout_s = 1300
rtk = "rtk"
output_limit = 8000

[tools.mail]
python = "python3"
helper = "/opt/qya/tools/mail_vps_fetch.py"
config = "secrets/mail_vps.toml"

# 可插拔提供方（docs/06-tools-plugins.md 第 2 节）；/provider 命令会改写这里
[plugins.image]
active = "default"
[plugins.image.providers.default]
kind = "openai_images"
base_url = "https://your-openai-compatible-image-api.example/v1"
key_file = "secrets/image.key"
model = "gpt-image-2.5-flare"
quality = "medium"
timeout_s = 180

[plugins.tts]
active = "gptsovits"
[plugins.tts.providers.gptsovits]
kind = "gptsovits_http"
base_url = "http://127.0.0.1:19880"
endpoint = "/tts"
timeout_s = 300

[plugins.search]
active = "yuanbao"
[plugins.search.providers.yuanbao]
kind = "tencent_wsa"
url = "https://api.wsa.cloud.tencent.com/SearchPro"
key_file = "secrets/yuanbao.key"
count = 10

[plugins.grok]
active = "default"
[plugins.grok.providers.default]
kind = "openai_chat"
url_file = "secrets/grok.url"
key_file = "secrets/grok.key"
model = "grok-chat-fast"
timeout_s = 120

# QQ 官方机器人（docs/07-platform-commands.md 第 2 节）；secret 放 secrets/qq.secret，allowed_users 填主人的 user_openid
[platforms.qq]
app_id = "<QQ_APP_ID>"
secret_file = "secrets/qq.secret"
allowed_users = ["<你的 user_openid>"]
reply_window_min = 60       # 被动回复有效期（分钟）
max_replies = 5             # 单条消息最多被动回复次数
proactive_monthly_quota = 4 # 每月主动消息额度，用尽后延迟到用户下次说话
inbox_dir = "/var/lib/qya/media/inbox"

# 抖音外部服务（docs/06-tools-plugins.md 第 3 节）。服务端允许的调用方为 tangyuge 用户与 qya.service
[douyin]
socket = "/run/tangyuge-douyin/login.sock"
saved_covers_dir = "/var/lib/qya/workspace/starlibrary_covers"
cache_dir = "/var/lib/qya/media/douyin"

[agent]
compaction_ratio = 0.9
compaction_keep_tokens = 20000
max_tool_calls = 40

# 回复节奏（docs/04-persona-memory.md 第 2 节）
[persona.pacer]
debounce_ms = 1800
max_wait_ms = 6000
max_segments = 4

# 表达与黑话学习（docs/04-persona-memory.md 第 3 节）
[persona.learner]
enabled = true
model = "kimi-for-coding"
effort = "low"
batch_messages = 30
idle_minutes = 10
min_messages = 8
max_items = 300
inject_max_chars = 220
