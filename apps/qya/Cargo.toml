[package]
name = "qya"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.39"
memory-stats = "1.2.0"
mimalloc = "0.1.52"
qya-agent = { version = "0.1.0", path = "../../crates/qya-agent" }
qya-command = { version = "0.1.0", path = "../../crates/qya-command" }
qya-config = { version = "0.1.0", path = "../../crates/qya-config" }
qya-core = { version = "0.1.0", path = "../../crates/qya-core" }
qya-douyin = { version = "0.1.0", path = "../../crates/qya-douyin" }
qya-llm = { version = "0.1.0", path = "../../crates/qya-llm" }
qya-orchestra = { version = "0.1.0", path = "../../crates/qya-orchestra" }
qya-persona = { version = "0.1.0", path = "../../crates/qya-persona" }
qya-platform = { version = "0.1.0", path = "../../crates/qya-platform" }
qya-plugins = { version = "0.1.0", path = "../../crates/qya-plugins" }
qya-store = { version = "0.1.0", path = "../../crates/qya-store" }
qya-tools = { version = "0.1.0", path = "../../crates/qya-tools" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true
