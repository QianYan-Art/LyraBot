[package]
name = "lyrabot"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
jiff = "0.2.39"
memory-stats = "1.2.0"
mimalloc = "0.1.52"
lyrabot-agent = { version = "0.1.0", path = "../../crates/lyrabot-agent" }
lyrabot-command = { version = "0.1.0", path = "../../crates/lyrabot-command" }
lyrabot-config = { version = "0.1.0", path = "../../crates/lyrabot-config" }
lyrabot-core = { version = "0.1.0", path = "../../crates/lyrabot-core" }
lyrabot-douyin = { version = "0.1.0", path = "../../crates/lyrabot-douyin" }
lyrabot-llm = { version = "0.1.0", path = "../../crates/lyrabot-llm" }
lyrabot-orchestra = { version = "0.1.0", path = "../../crates/lyrabot-orchestra" }
lyrabot-persona = { version = "0.1.0", path = "../../crates/lyrabot-persona" }
lyrabot-platform = { version = "0.1.0", path = "../../crates/lyrabot-platform" }
lyrabot-plugins = { version = "0.1.0", path = "../../crates/lyrabot-plugins" }
lyrabot-store = { version = "0.1.0", path = "../../crates/lyrabot-store" }
lyrabot-tools = { version = "0.1.0", path = "../../crates/lyrabot-tools" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "sync", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints]
workspace = true
